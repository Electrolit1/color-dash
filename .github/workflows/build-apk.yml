name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias y compilar web
        run: |
          npm ci
          npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Compilar y renombrar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../apk-out
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-out/COLOR-DASH-v0.2.0.apk

      - name: Subir APK renombrado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: COLOR-DASH-APK-v0.2.0
          path: apk-out/COLOR-DASH-v0.2.0.apk